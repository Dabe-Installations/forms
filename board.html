<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Run Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: black wall-screen board. Full-width summary + sticky filters, then a grid of white run cards, each with a bright header, progress bar and store rows. */
:root{
  --bg:#0d0d0d; --card:#ffffff; --ink:#0d1620; --muted:#555555; --line:#dfe5ea; --fg:#ffffff; --dim:#a3a3a3;
  --accent:#1a6b5a; --accent-ink:#ffffff; --green-text:#3fb99c; --surface:#161616; --line-d:#2a2a2a;
  --done:#3fb99c; --done-ink:#04261e;
  --todo:#2a2a2a; --todo-ink:#ffffff;
  --rev:#ffa51f; --rev-ink:#2b1700;
  --late:#ff3d55; --late-ink:#ffffff;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow","Segoe UI",Arial,sans-serif;
}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.45;padding-inline:20px;padding-block:20px 56px}
.wrap{width:100%;max-width:none;margin:0}
h1{font-family:var(--font-display);font-size:2.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1;color:#fff}
h1::after{content:"";display:block;width:64px;height:4px;background:var(--green-text);margin-top:8px}
.sub{color:var(--dim);margin:6px 0 0;font-size:1rem}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-block:18px 12px}
.tile{background:var(--surface);border:1px solid var(--line-d);border-radius:8px;padding:12px 18px;min-width:0}
.tile b{display:block;font-family:var(--font-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.tile span{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.t-done b{color:var(--green-text)} .t-todo b{color:#fff} .t-rev b{color:var(--rev)}
.bar{height:14px;border-radius:7px;background:var(--line-d);overflow:hidden;display:flex;margin-bottom:16px}
.bar i{display:block;height:100%}
.bar .b-done{background:var(--done)} .bar .b-rev{background:var(--rev)}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line-d);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.seg{display:flex;border-radius:8px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:.95rem;font-weight:600;border:0;background:#fff;color:var(--ink);padding:9px 16px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.f select,.f input{font:inherit;font-size:.95rem;color:var(--ink);background:#fff;border:0;border-radius:8px;padding:9px 10px;max-width:100%}
.f input{width:14rem}
.clear{font:inherit;font-size:.95rem;font-weight:600;color:var(--green-text);background:none;border:0;padding:9px 4px;cursor:pointer;text-decoration:underline}
.count{margin:12px 0 0;color:var(--dim);font-size:.95rem}
:focus-visible{outline:3px solid var(--green-text);outline-offset:2px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:18px;align-items:start;margin-top:16px}
.run{background:var(--card);color:var(--ink);border-radius:12px;overflow:hidden}
.run-h{background:var(--accent);color:var(--accent-ink);padding:12px 16px 12px}
.run-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.run-name{font-family:var(--font-display);font-size:2.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.run-date{font-weight:700;font-size:1.2rem;color:#ffd21f}
.run-prog{margin-left:auto;font-variant-numeric:tabular-nums;font-size:1rem;font-weight:700}
.run-meta{font-size:.9rem;margin-top:2px}
.pbar{height:9px;border-radius:5px;background:rgba(255,255,255,.25);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:#fff}
.row{padding:12px 16px;border-top:1px solid var(--line)}
.run-h + .row{border-top:0}
.r-top{display:flex;gap:10px;align-items:flex-start}
.pills{display:flex;flex-direction:column;gap:4px;flex:none;width:5.6rem}
.pill{display:block;text-align:center;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:99px}
.p-done{background:var(--done);color:var(--done-ink)}
.p-todo{background:var(--todo);color:var(--todo-ink)}
.p-rev{background:var(--rev);color:var(--rev-ink)}
.late{background:var(--late);color:var(--late-ink)}
.main{min-width:0;flex:1}
.store{font-weight:700;font-size:1.08rem;line-height:1.25;overflow-wrap:anywhere}
.addr{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font-size:.76rem;font-weight:600;background:#e9eceb;color:#2a2a2a;border-radius:4px;padding:2px 7px}
.tag.warn{background:#ffe3b8;color:#6b3a00}
.who{font-size:.9rem;margin-top:5px;font-weight:600}
.who small{color:var(--muted);font-weight:400;font-size:.84rem}
.note{font-size:.88rem;white-space:pre-line;color:var(--ink);background:#f1f3f2;border-radius:6px;padding:7px 10px;margin-top:8px;overflow-wrap:anywhere}
.empty{grid-column:1/-1;padding:60px 16px;text-align:center;color:var(--dim)}
@media (min-width:1900px){body{font-size:20px}}
@media (max-width:640px){.summary{grid-template-columns:repeat(2,1fr)}.f input{width:100%}.f{flex:1 1 8rem}}

.pin{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.pin[hidden]{display:none}
.pin form{background:#fff;color:var(--ink);border-radius:12px;padding:24px;width:min(100%,360px);display:flex;flex-direction:column;gap:12px}
.pin h2{font-family:var(--font-display);font-size:1.8rem;text-transform:uppercase;margin:0}
.pin input{font:inherit;font-size:1.1rem;padding:10px;border:2px solid var(--line);border-radius:8px}
.pin button{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer}
.pin p{margin:0;color:var(--muted);font-size:.9rem}
.pin .err{color:var(--late);font-weight:600}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:var(--ink);padding:10px 18px;border-radius:8px;font-weight:600;z-index:30;box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:90vw}
.msg[hidden]{display:none}
.msg.bad{background:var(--late);color:#fff}
.assign{display:flex;align-items:center;gap:8px;margin-top:8px}
.assign select{font:inherit;font-size:.9rem;padding:6px 8px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
.assign select.empty{border-color:var(--rev)}
.assign label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.assign{flex-wrap:wrap}
.assign input[type=date]{font:inherit;font-size:.9rem;padding:5px 8px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
.assign input[type=date].empty{border-color:var(--rev)}
.run-assign input[type=date]{font:inherit;font-size:.9rem;padding:5px 8px;border:0;border-radius:6px;background:#fff;color:var(--ink)}
.run-assign .lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.pin button[disabled]{opacity:.6;cursor:wait}
.lockd{font-size:.82rem;color:var(--muted);margin-top:6px;font-weight:600}
.run-assign{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.run-assign select{font:inherit;font-size:.9rem;padding:6px 8px;border:0;border-radius:6px;background:#fff;color:var(--ink)}
.run-assign .go,.run-assign .no{font:inherit;font-size:.85rem;font-weight:700;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
.run-assign .go{background:#fff;color:var(--accent)}
.run-assign .no{background:transparent;color:#fff;text-decoration:underline}
.run-assign .q{font-size:.9rem;font-weight:600}
.p-un{background:#fff;color:var(--rev);box-shadow:inset 0 0 0 2px var(--rev)}
.refresh{font:inherit;font-size:.95rem;font-weight:600;color:var(--ink);background:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
</style>
</head>
<body>
<div class="pin" id="pin"><form id="pin-form"><h2>Store Run Board</h2><p>Enter the owner PIN to open the board. It is kept in this browser only.</p><input id="pin-in" type="password" inputmode="numeric" autocomplete="off" placeholder="Owner PIN"><button type="submit" id="pin-btn">Open board</button><p class="err" id="pin-err"></p></form></div>
<div class="wrap">
  <h1>Store Run Board</h1>
  <p class="sub" id="asof">Loading…</p>
  <div class="summary" id="summary"></div>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <div class="filters" id="filters">
    <div class="f"><label>Status</label>
      <div class="seg" id="status-seg">
        <button type="button" data-v="all" aria-pressed="true">All</button>
        <button type="button" data-v="un" aria-pressed="false">Unassigned</button>
        <button type="button" data-v="todo" aria-pressed="false">To do</button>
        <button type="button" data-v="done" aria-pressed="false">Done</button>
        <button type="button" data-v="rev" aria-pressed="false">Revisit</button>
      </div>
    </div>
    <div class="f"><label for="f-date">Run date</label><select id="f-date"></select></div>
    <div class="f"><label for="f-run">Run</label><select id="f-run"></select></div>
    <div class="f"><label for="f-team">Team</label><select id="f-team"></select></div>
    <div class="f"><label for="f-brand">Retailer</label><select id="f-brand"></select></div>
    <div class="f"><label for="f-q">Search</label><input id="f-q" type="search" placeholder="Store, suburb, note"></div>
    <button type="button" class="clear" id="clear">Clear filters</button>
    <button type="button" class="refresh" id="refresh">Refresh</button>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</div>
<div class="msg" id="msg" hidden></div>
<script>
// Set this to the Apps Script web app URL that the Hub already uses.
var API_URL = 'https://script.google.com/macros/s/AKfycbyx2biSIuIalJAlaeIpWtFim6nUGNbXE8d6rpX80UlJYIl_7cHN2zTgAtuZlRnEZouz3A/exec';
var BASE_TEAMS = ['T1 Vini','T2 Steven','T3 Debora','T4 Leo Lisboa','T4 Luciano','T5 WA','T6 QLD'];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function pd(s){ if(!s) return null; var p=String(s).split("/"); return new Date(+p[2],+p[1]-1,+p[0]); }
function fd(s){ var d=pd(s); return d&&!isNaN(d)? DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()] : ""; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function brand(a){ var u=String(a).toUpperCase();
  if(u.indexOf("SEPHORA")===0) return "Sephora"; if(u.indexOf("ATOMICA")===0) return "Atomica";
  if(u.indexOf("DAVID JONES")===0) return "David Jones"; if(u.indexOf("BETTA")===0) return "Betta";
  if(u.indexOf("BING LEE")===0) return "Bing Lee"; if(u.indexOf("HARVEY")===0) return "Harvey Norman";
  if(u.indexOf("JB")===0) return "JB Hi-Fi"; if(u.indexOf("TGG")===0) return "TGG"; return "Other"; }
var NAME={done:"Done",todo:"To do",rev:"Revisit"};
var PIN="", rows=[], teams=[], pending=null;
var st={status:"all",date:"",run:"",team:"",brand:"",q:""};
var TODAY=new Date(); TODAY.setHours(0,0,0,0);
var $=function(id){return document.getElementById(id);};

function lsGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function toast(t,bad){var m=$("msg");m.textContent=t;m.className="msg"+(bad?" bad":"");m.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){m.hidden=true;},bad?6000:3000);}

function api(params){ return fetch(API_URL+"?"+params).then(function(r){return r.json();}); }
function post(body){ return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){return r.json();}); }

var inflight=null;
function load(){
  if(inflight) return inflight;
  $("asof").textContent=rows.length?"Refreshing…":"Loading…";
  inflight=api("action=boardRows&pin="+encodeURIComponent(PIN)).then(function(j){
    if(!j.ok){ throw new Error(j.error==="pin"?"pin":(j.error||"error")); }
    lsSet("dabe_board_cache",JSON.stringify(j.rows));
    useRows(j.rows);
    $("asof").textContent="Live from the Store Run Schedule sheet · "+new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});
  }).then(function(){inflight=null;},function(e){inflight=null;throw e;});
  return inflight;
}
function useRows(list){
    rows=list.map(function(r){
      var d=pd(r.date), status=r.done?"done":(r.revisit?"rev":"todo");
      r.d=d; r.status=status; r.brand=brand(r.address); r.team=String(r.team||"").trim();
      r.un=!r.done && !r.team;
      r.late=!r.done && d && d<TODAY;
      r.installKey=r.installKey||"";
      return r; });
    var set={}; BASE_TEAMS.concat(rows.map(function(r){return r.team;})).forEach(function(t){ if(t) set[t]=1; });
    teams=Object.keys(set).sort();
    fillFilters(); summary(); render();
}
function fillSelect(id,label,vals,fmt){
  var el=$(id), cur=el.value;
  el.innerHTML='<option value="">'+label+'</option>'+vals.map(function(v){return '<option value="'+esc(v)+'">'+esc(fmt?fmt(v):v)+'</option>';}).join("");
  el.value=cur;
}
function uniq(a){ return a.filter(function(v,i){return v&&a.indexOf(v)===i;}); }
function fillFilters(){
  fillSelect("f-date","All dates",uniq(rows.map(function(r){return r.date;})),fd);
  fillSelect("f-run","All runs",uniq(rows.map(function(r){return r.run;})));
  fillSelect("f-team","All teams",teams);
  fillSelect("f-brand","All retailers",uniq(rows.map(function(r){return r.brand;})).sort());
}
function summary(){
  var n=rows.length, done=rows.filter(function(r){return r.status==="done";}).length;
  var un=rows.filter(function(r){return r.un;}).length, rev=rows.filter(function(r){return r.status==="rev";}).length;
  $("summary").innerHTML=
    '<div class="tile"><b>'+n+'</b><span>Store visits</span></div>'+
    '<div class="tile t-done"><b>'+done+'</b><span>Done</span></div>'+
    '<div class="tile t-rev"><b>'+un+'</b><span>No installer yet</span></div>'+
    '<div class="tile t-todo"><b>'+(n-done)+'</b><span>Left to do</span></div>';
  $("bar").innerHTML='<i class="b-done" style="width:'+(done/n*100)+'%"></i><i class="b-rev" style="width:'+(rev/n*100)+'%"></i>';
}
function match(r){
  if(st.status==="un"){ if(!r.un) return false; }
  else if(st.status!=="all" && r.status!==st.status) return false;
  if(st.date && r.date!==st.date) return false;
  if(st.run && r.run!==st.run) return false;
  if(st.team && r.team!==st.team) return false;
  if(st.brand && r.brand!==st.brand) return false;
  if(st.q){ var h=(r.store+" "+r.address+" "+r.comment+" "+r.team+" "+r.run).toLowerCase(); if(h.indexOf(st.q.toLowerCase())<0) return false; }
  return true;
}
function teamOptions(sel){
  return '<option value="">Unassigned</option>'+teams.map(function(t){return '<option value="'+esc(t)+'"'+(t===sel?' selected':'')+'>'+esc(t)+'</option>';}).join("");
}
function render(){
  var vis=rows.filter(match), groups=[], map={};
  vis.forEach(function(r){ var k=r.date+"|"+r.run; if(!map[k]){map[k]={key:k,date:r.date,run:r.run,items:[]};groups.push(map[k]);} map[k].items.push(r); });
  var out=groups.map(function(g){
    var all=rows.filter(function(r){return r.date===g.date && r.run===g.run;});
    var dn=all.filter(function(r){return r.status==="done";}).length;
    var open=all.filter(function(r){return !r.done && !r.locked;}).length;
    var crew=(all.filter(function(r){return r.crew;})[0]||{}).crew||"";
    var pct=all.length?Math.round(dn/all.length*100):0;
    var h='<section class="run"><div class="run-h"><div class="run-top"><span class="run-name">'+esc(g.run)+'</span><span class="run-date">'+fd(g.date)+'</span><span class="run-prog">'+dn+' / '+all.length+' done</span></div>'+
      '<div class="run-meta">'+(g.items[0].hrs?esc(g.items[0].hrs)+' hrs':'')+(crew?' · '+esc(crew):'')+'</div><div class="pbar"><i style="width:'+pct+'%"></i></div>';
    if(open){
      if(pending && pending.key===g.key && pending.kind==="date"){
        h+='<div class="run-assign"><span class="q">Set install date '+(pending.date?fdIso(pending.date):'to blank')+' for '+open+' open store'+(open>1?'s':'')+' in '+esc(g.run)+'?</span><button type="button" class="go" data-act="runyes" data-k="'+esc(g.key)+'">Yes, set date</button><button type="button" class="no" data-act="runno">Cancel</button></div>';
      } else if(pending && pending.key===g.key){
        h+='<div class="run-assign"><span class="q">Assign '+(pending.team?esc(pending.team):'nobody')+' to '+open+' open store'+(open>1?'s':'')+' in '+esc(g.run)+'?</span><button type="button" class="go" data-act="runyes" data-k="'+esc(g.key)+'">Yes, assign</button><button type="button" class="no" data-act="runno">Cancel</button></div>';
      } else {
        h+='<div class="run-assign"><select data-act="runpick" data-k="'+esc(g.key)+'" aria-label="Assign whole run"><option value="__">Assign whole run…</option><option value="">Unassigned</option>'+teams.map(function(t){return '<option value="'+esc(t)+'">'+esc(t)+'</option>';}).join("")+'</select>'+
          '<span class="lbl">Install date for run</span><input type="date" data-act="rundate" data-k="'+esc(g.key)+'" aria-label="Install date for whole run"></div>';
      }
    }
    h+='</div>';
    g.items.forEach(function(r){
      var tags='<span class="tag">'+esc(r.brand)+'</span>';
      if(r.before && r.before!=="-") tags+='<span class="tag warn">Before hours</span>';
      if(r.photos) tags+='<span class="tag">'+r.photos+' photos</span>';
      var pills='<span class="pill p-'+r.status+'">'+NAME[r.status]+'</span>'+(r.un?'<span class="pill p-un">No installer</span>':'')+(r.late?'<span class="pill late">Overdue</span>':'');
      var who='';
      if(r.done) who='<div class="who">'+esc(r.team||"—")+' <small>· done '+fd(r.completionDate)+'</small></div>';
      else if(r.locked) who='<div class="who">'+esc(r.team||"—")+'</div><div class="lockd">Approved and locked</div>';
      else who='<div class="assign"><label for="a'+r.row+'">Installer</label><select id="a'+r.row+'" data-act="one" data-row="'+r.row+'" class="'+(r.team?'':'empty')+'">'+teamOptions(r.team)+'</select>'+
        '<label for="d'+r.row+'">Install date</label><input type="date" id="d'+r.row+'" data-act="date" data-row="'+r.row+'" value="'+esc(r.installKey)+'" class="'+(r.installKey?'':'empty')+'"></div>';
      h+='<div class="row"><div class="r-top"><div class="pills">'+pills+'</div><div class="main"><div class="store">'+esc(r.store)+'</div><div class="addr">'+esc(r.address)+'</div><div class="tags">'+tags+'</div>'+who+'</div></div>'+(r.comment?'<div class="note">'+esc(r.comment)+'</div>':'')+'</div>';
    });
    return h+'</section>';
  }).join("");
  $("list").innerHTML=out||'<div class="empty">No stores match these filters.</div>';
  $("count").textContent="Showing "+vis.length+" of "+rows.length+" store visits in "+groups.length+" runs";
}

function assign(items,team){
  return post({action:"assign",owner:PIN,assignTeam:team,items:items.map(function(r){return {row:r.row,run:r.run,store:r.store};})}).then(function(j){
    if(!j.ok){ toast(j.error==="pin"?"Wrong PIN":("Not saved: "+j.error),true); return load(); }
    items.forEach(function(r){ var sk=(j.skipped||[]).some(function(s){return s.store===r.store;}); if(!sk){ r.team=team; r.un=!r.done && !team; } });
    var msg=j.changed+" store"+(j.changed===1?"":"s")+" "+(team?"assigned to "+team:"set to unassigned");
    if(j.skipped&&j.skipped.length){ toast(msg+". Skipped "+j.skipped.map(function(s){return s.store+" ("+s.reason+")";}).join(", "),true); return load(); }
    toast(msg); summary(); fillFilters(); render();
  }).catch(function(){ toast("Could not reach the sheet. Nothing was changed.",true); return load(); });
}

function fdIso(k){ var p=String(k).split("-"); return p.length===3? fd(p[2]+"/"+p[1]+"/"+p[0]) : k; }
function setDate(items,key){
  return post({action:"setInstallDate",owner:PIN,date:key,items:items.map(function(r){return {row:r.row,run:r.run,store:r.store};})}).then(function(j){
    if(!j.ok){ toast(j.error==="pin"?"Wrong PIN":("Not saved: "+j.error),true); return load(); }
    var dmy=key? key.split("-").reverse().join("/") : "";
    items.forEach(function(r){ var sk=(j.skipped||[]).some(function(s){return s.store===r.store;}); if(!sk){ r.installKey=key; r.installDate=dmy; r.date=dmy||r.clientDate||r.date; r.d=pd(r.date); r.late=!r.done && r.d && r.d<TODAY; } });
    var msg=j.changed+" store"+(j.changed===1?"":"s")+(key?" set to "+fdIso(key):" install date cleared");
    if(j.skipped&&j.skipped.length){ toast(msg+". Skipped "+j.skipped.map(function(s){return s.store+" ("+s.reason+")";}).join(", "),true); return load(); }
    toast(msg); summary(); fillFilters(); render();
  }).catch(function(){ toast("Could not reach the sheet. Nothing was changed.",true); return load(); });
}

document.addEventListener("change",function(e){
  var t=e.target, a=t.getAttribute&&t.getAttribute("data-act");
  if(a==="date"){
    var rr=rows.filter(function(x){return String(x.row)===t.getAttribute("data-row");})[0];
    t.disabled=true; setDate([rr],t.value).then(function(){t.disabled=false;});
  } else if(a==="rundate"){
    pending={key:t.getAttribute("data-k"),kind:"date",date:t.value}; render();
  } else if(a==="one"){
    var r=rows.filter(function(x){return String(x.row)===t.getAttribute("data-row");})[0];
    t.disabled=true; assign([r],t.value).then(function(){t.disabled=false;});
  } else if(a==="runpick"){
    if(t.value==="__") return;
    pending={key:t.getAttribute("data-k"),team:t.value}; render();
  }
});
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("button[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act");
  if(a==="runno"){ pending=null; render(); }
  if(a==="runyes"&&pending){
    var k=pending.key, p=pending; pending=null;
    var items=rows.filter(function(r){return (r.date+"|"+r.run)===k && !r.done && !r.locked;});
    if(p.kind==="date") setDate(items,p.date); else assign(items,p.team);
  }
});
$("status-seg").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  st.status=b.getAttribute("data-v");
  [].forEach.call(this.querySelectorAll("button"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
  render();
});
[["f-date","date"],["f-run","run"],["f-team","team"],["f-brand","brand"]].forEach(function(p){ $(p[0]).addEventListener("change",function(){st[p[1]]=this.value;render();}); });
$("f-q").addEventListener("input",function(){st.q=this.value.trim();render();});
$("clear").addEventListener("click",function(){
  st={status:"all",date:"",run:"",team:"",brand:"",q:""};
  ["f-date","f-run","f-team","f-brand","f-q"].forEach(function(id){$(id).value="";});
  [].forEach.call(document.querySelectorAll("#status-seg button"),function(x){x.setAttribute("aria-pressed",x.getAttribute("data-v")==="all"?"true":"false");});
  render();
});
$("refresh").addEventListener("click",function(){ load().then(function(){toast("Refreshed");}).catch(function(){toast("Could not refresh",true);}); });

var timer=null;
function startTimer(){ if(!timer) timer=setInterval(function(){ if(!pending && !document.hidden) load().catch(function(){}); },300000); }
function start(pin,fromSaved){
  PIN=pin;
  if(!API_URL){ $("pin-err").textContent="This board is not connected to the sheet yet."; return; }
  $("pin-err").textContent=""; $("pin-btn").disabled=true; $("pin-btn").textContent="Opening…";
  // A saved PIN opens the board straight away; the data loads behind it (a saved copy shows first if there is one).
  if(fromSaved){ $("pin").hidden=true; try{ var c=JSON.parse(lsGet("dabe_board_cache")||"null"); if(c&&c.length){ useRows(c); $("asof").textContent="Showing the last saved copy · refreshing…"; } }catch(e){} }
  load().then(function(){ lsSet("dabe_board_pin",pin); $("pin").hidden=true; $("pin-btn").disabled=false; $("pin-btn").textContent="Open board"; startTimer(); })
  .catch(function(e){
    $("pin-btn").disabled=false; $("pin-btn").textContent="Open board";
    if(e.message==="pin"){ lsSet("dabe_board_pin",""); lsSet("dabe_board_cache",""); rows=[]; $("list").innerHTML=""; $("pin").hidden=false; $("pin-err").textContent="That PIN is not right."; return; }
    // Any other problem (slow signal, script waking up): keep the PIN, keep the board, try once more in a few seconds.
    if(!fromSaved && !rows.length){ $("pin").hidden=false; $("pin-err").textContent="Could not load the sheet. Tap Open board to try again."; return; }
    $("asof").textContent="Could not refresh. Trying again…";
    setTimeout(function(){ load().then(function(){ startTimer(); }).catch(function(){ $("asof").textContent=(rows.length?"Showing the last saved copy. ":"")+"Could not reach the sheet. Tap Refresh."; toast("Could not reach the sheet",true); }); },4000);
  });
}
$("pin-form").addEventListener("submit",function(e){ e.preventDefault(); if($("pin-btn").disabled) return; var v=$("pin-in").value.trim(); if(v) start(v,false); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden && PIN && !pending) load().catch(function(){}); });
var saved=lsGet("dabe_board_pin"); if(saved){ start(saved,true); }
</script>
